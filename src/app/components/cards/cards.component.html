<div class="card">
  <div class="card-header">{{title}}</div>
  <div class="card-content">
    {{short_description}}
  </div>
  <div class="card-actions">
    <button class="action-btn" (click)="toggleResults()">Ver Mais</button>
  </div>
  @if (showResults) {
    <app-card-results [image_url]="image_url" [code_url]="code_url"></app-card-results>
  }
</div>
